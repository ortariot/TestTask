[project]
name = "buro"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.18.5",
    "astropy>=8.0.1",
    "asyncpg>=0.31.0",
    "clickhouse-connect>=1.6.0",
    "fastapi>=0.139.2",
    "numpy>=2.5.1",
    "orjson>=3.11.9",
    "pydantic-settings>=2.14.2",
    "sgp4>=2.27",
    "skyfield>=1.54",
    "sqlalchemy>=2.0.51",
    "structlog>=26.1.0",
    "taskiq>=0.12.4",
    "taskiq-fastapi>=0.5.0",
    "taskiq-redis>=1.2.3",
    "uvicorn>=0.51.0",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "ruff>=0.16.0",
]

[tool.ruff]
target-version = "py312"
line-length = 79

src = ["app", "worker"] 

force-exclude = true

exclude = [
    "app/migrations",
    "worker/main.py",
]

[tool.ruff.lint]

select = [
    "E", 
    "W",  
    "F",       
    "I",       
    "B",       
    "C4",      
    "UP",      
    "ARG",     
    "PTH",     
    "S",       
    "BLE",     
    "ERA",     
    "PL",      
    "RUF",     
]
ignore = [
    "D",       
    "S101",    
]



[tool.ruff.lint.isort]
combine-as-imports = true

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.params.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body"
]

[tool.mypy]
strict = true
python_version = "3.12"
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
pretty = true
explicit_package_bases = true

plugins = [
    "pydantic.mypy",
    "sqlalchemy.ext.mypy.plugin"
]

exclude = [
    '^app/migrations/',
]

[tool.pydantic-mypy]
init_forbid_extra = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true

[[tool.mypy.overrides]]
module = "pydantic.*"
init_typed = true
