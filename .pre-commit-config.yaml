repos:
  - repo: local
    hooks:
      - id: ruff-check
        name: Ruff Linter
        entry: uv run ruff check --fix
        language: system
        types: [python]
        require_serial: true

      - id: ruff-format
        name: Ruff Formatter
        entry: uv run ruff format
        language: system
        types: [python]
        require_serial: true

      - id: mypy-services
        name: Mypy
        entry: bash -c 'for dir in */; do [[ "$dir" =~ ^(\..*|venv/)$ ]] && continue; echo "Checking $dir..."; uv run mypy "$dir"; done'
        language: system
        types: [python]
        pass_filenames: false