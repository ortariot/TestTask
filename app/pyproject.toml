[project]
name = "buro"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "alembic>=1.18.5",
    "astropy>=8.0.1",
    "asyncpg>=0.31.0",
    "clickhouse-connect>=1.6.0",
    "fastapi>=0.139.2",
    "numpy>=2.5.1",
    "orjson>=3.11.9",
    "pydantic-settings>=2.14.2",
    "pytest>=9.1.1",
    "sgp4>=2.27",
    "skyfield>=1.54",
    "sqlalchemy>=2.0.51",
    "structlog>=26.1.0",
    "taskiq>=0.12.4",
    "taskiq-fastapi>=0.5.0",
    "taskiq-redis>=1.2.3",
    "uvicorn>=0.51.0",
]

[dependency-groups]
dev = [
    "httpx>=0.28.0",
    "mypy>=2.3.0",
    "pytest>=8.4.0",
    "pytest-asyncio>=1.0.0",
    "ruff>=0.16.0",
]

[tool.ruff]
target-version = "py314"
line-length = 79

force-exclude = true

exclude = [
    "migrations",
]

[tool.ruff.lint]

select = [
    "E", 
    "W",  
    "F",       
    "I",       
    "B",       
    "C4",      
    "UP",      
    "ARG",     
    "PTH",     
    "S",       
    "BLE",     
    "ERA",     
    "PL",      
    "RUF",     
]
ignore = [
    "D",       
    "S101",    
]



[tool.ruff.lint.isort]
combine-as-imports = true
known-first-party = [
    "api",
    "core",
    "database",
    "helpers",
    "models",
    "repositories",
    "schemas",
    "services",
    "solvers",
    "workers",
]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = [
    "fastapi.Depends",
    "fastapi.params.Depends",
    "fastapi.Query",
    "fastapi.Path",
    "fastapi.Body"
]

[tool.pytest.ini_options]
pythonpath = [".", ".."]
testpaths = ["../tests"]
asyncio_mode = "auto"
addopts = "-v --tb=short --strict-markers"
markers = [
    "validation: endpoint validation tests",
    "time_slicing: time-range slicing tests",
]

[tool.mypy]
mypy_path = "$MYPY_CONFIG_FILE_DIR"
strict = true
python_version = "3.14"
ignore_missing_imports = true
warn_unused_configs = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
pretty = true
explicit_package_bases = true

plugins = [
    "pydantic.mypy",
    "sqlalchemy.ext.mypy.plugin"
]

exclude = [
    '^migrations/',
    '/migrations/'
]

[tool.pydantic-mypy]
init_forbid_extra = true
init_typed = true
warn_required_dynamic_aliases = true
warn_untyped_fields = true
