services:
  sat-postgres:
    image: postgres:17-alpine
    container_name: sat-postgres
    restart: unless-stopped
    shm_size: 1g
    env_file:
      - .env
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - pg_data:${CONTAINER_PGDATA_BASE:-/var/lib/postgresql/data}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_DB:-app_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2g
        reservations:
          cpus: '0.5'
          memory: 512m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
  sat-redis:
    image: redis:7.4-alpine
    container_name: sat-redis
    restart: unless-stopped

    command: >
      redis-server 
      --requirepass "${REDIS_PASSWORD}"
      --maxmemory 1gb
      --maxmemory-policy allkeys-lru
      --appendonly yes
      --appendfsync everysec
    env_file:
      - .env
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
  
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 5s

    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1.5g
        reservations:
          cpus: '0.2'
          memory: 256m
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
  sat-clickhouse:
    image: clickhouse/clickhouse-server:26.3
    container_name: sat-clickhouse
    restart: unless-stopped
    env_file:
      - .env
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"     
      - "${CLICKHOUSE_NATIVE_PORT:-9000}:9000"    
    volumes:
      - clickhouse_data:/var/lib/clickhouse    
      - ./clickhouse_logs:/var/log/clickhouse-server
      - ./config/init-clickhouse.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "clickhouse-client --user=${CLICKHOUSE_USER} --password=${CLICKHOUSE_PASSWORD} --query='SELECT 1'"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 4g
        reservations:
          cpus: '0.5'
          memory: 1g
    logging:
      driver: "json-file"
      options:
        max-size: "100m"
        max-file: "3"
        compress: "true"
  sat-api:
    build:
      context: ./app
      target: runtime
    container_name: sat-api
    restart: always
    command: sh -c "python -m alembic upgrade head && python -m uvicorn main:app --host 0.0.0.0 --port 8000"
    ports:
      - "8000:8000"
    env_file:
      - .env
    depends_on:
      sat-postgres:
        condition: service_healthy
      sat-redis:
        condition: service_healthy
      sat-clickhouse:
        condition: service_healthy
    healthcheck:

      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 5s
      retries: 3

 
  sat-worker:
    build:
      context: ./app
      target: runtime
    container_name: sat-worker
    restart: always
    command: taskiq worker core.taskbroker:broker workers.calctask --workers 4
    env_file:
      - .env
    depends_on:
      sat-api:
        condition: service_healthy 


  sat-scheduler:
    build:
      context: ./app
      target: runtime
    container_name:  sat-scheduler
    restart: always
    command: taskiq scheduler core.taskbroker:scheduler
    env_file:
      - .env
    depends_on:
      sat-api:
        condition: service_healthy

volumes:
  pg_data:
    driver: local
  redis_data:
    driver: local
  clickhouse_data:
    driver: local